<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1210">
<title>spring과 바위 - 테라리움 산행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
:root{
  --bg:#0d1210; --surface:#161f1a; --ink:#e6efe8; --muted:#8da396; --line:#2b3a31;
  --moss:#8fcf6a; --water:#6ec3e6; --warn:#e9a24f; --heart:#ee7891;
  --f-voice:"Gaegu","Nanum Pen Script","Apple SD Gothic Neo",cursive;
  --f-ui:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input{font:inherit;color:inherit}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding:8px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px))}
header{display:flex;align-items:center;gap:8px}
.title{flex:1;min-width:0}
.title b{font-family:var(--f-voice);font-size:28px;line-height:1;display:block}
.title span{font-size:12px;color:var(--muted)}
.chip{height:32px;padding:0 11px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--moss);border-color:var(--moss);color:#10200a}
.chip:focus-visible,.q:focus-visible,#send:focus-visible,#msg:focus-visible{outline:2px solid var(--water);outline-offset:2px}
.meters{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.m{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.m i{font-style:normal;flex:none}
.bar{flex:1;height:7px;border-radius:4px;background:#24312a;overflow:hidden}
.bar>div{height:100%;width:50%;border-radius:4px;transition:width .4s}
#bSt{background:var(--moss)} #bWa{background:var(--water)}
.steps{flex:none;white-space:nowrap}
#wrap{flex:1;min-height:180px;display:flex;align-items:center;justify-content:center}
#stage{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:12px;overflow:hidden;background:#101513}
#cv,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
.bubble{position:absolute;left:0;top:0;max-width:74%;width:max-content;padding:6px 12px 7px;border-radius:15px;
  background:#fff;color:#1c2920;font-family:var(--f-voice);font-size:20px;line-height:1.2;box-shadow:0 3px 10px rgba(0,0,0,.35);
  opacity:0;transition:opacity .22s;pointer-events:none;word-break:keep-all;text-wrap:pretty;will-change:transform}
.bubble.on{opacity:1}
.bubble::after{content:"";position:absolute;bottom:-7px;left:var(--tail,50%);margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:inherit}
.bubble.s{border-top-color:#fff}
.bubble.r{background:#dfe8d3;border:2px solid #6f9a4c;color:#22301f;font-size:19px;padding:5px 11px 6px;border-top-color:#6f9a4c}
.bubble.r::after{border-top-color:#6f9a4c}
.pill{position:absolute;left:50%;bottom:2.2%;transform:translateX(-50%);max-width:88%;padding:4px 12px;border-radius:12px;background:rgba(10,16,12,.7);color:#eef6ee;
  font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .3s;pointer-events:none}
.pill.on{opacity:1}
.hint{position:absolute;left:50%;top:2.5%;transform:translateX(-50%);width:max-content;max-width:90%;padding:5px 12px;border-radius:12px;background:rgba(10,16,12,.72);
  font-size:12.5px;text-align:center;opacity:1;transition:opacity 1s;pointer-events:none;line-height:1.35}
.hint.off{opacity:0}
.quick{display:flex;gap:6px;overflow-x:auto;padding:1px 0 3px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.q{flex:none;height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;cursor:pointer;white-space:nowrap}
.q:active{background:#223127}
.q.pulse{border-color:var(--water);animation:pl 1.2s infinite}
@keyframes pl{50%{box-shadow:0 0 0 4px rgba(110,195,230,.25)}}
.chat{display:flex;gap:6px}
#msg{flex:1;min-width:0;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font-size:16px}
#msg::placeholder{color:#6f857a}
#send{flex:none;height:40px;padding:0 18px;border-radius:20px;border:0;background:var(--moss);color:#10200a;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title"><b>spring</b><span>테라리움 산행 · 바위와 함께</span></div>
    <button class="chip" id="tSfx" aria-pressed="true">소리</button>
    <button class="chip" id="tVoice" aria-pressed="false">목소리</button>
  </header>
  <div class="meters">
    <div class="m"><i>체력</i><div class="bar"><div id="bSt"></div></div></div>
    <div class="m"><i>물</i><div class="bar"><div id="bWa"></div></div></div>
    <div class="steps" id="steps">0걸음</div>
  </div>
  <div id="wrap">
    <div id="stage">
      <canvas id="cv" width="611" height="1340"></canvas>
      <svg id="fx" viewBox="100 70 611 1340" xmlns="http://www.w3.org/2000/svg">
        <g id="rockFace"></g>
        <g id="hikerLayer"></g>
        <g id="efx"></g>
      </svg>
      <div class="bubble r" id="bR"></div>
      <div class="bubble s" id="bS"></div>
      <div class="pill" id="pill"></div>
      <div class="hint" id="hint">spring을 눌러보고, 끌어서 걷게 해보세요.<br>화면을 쓸어 넘기면 바람이 불어요.</div>
    </div>
  </div>
  <div class="quick" id="quick"></div>
  <form class="chat" id="chat" autocomplete="off">
    <input id="msg" type="text" maxlength="60" placeholder="spring에게 말을 걸어보세요" enterkeyhint="send">
    <button id="send" type="submit">보내기</button>
  </form>
</div>

  if (moving) {
    const dist = sp.speed * dt, s = depthScale(sp.y) * 1.05;
    const before = Math.floor(sp.phase / Math.PI); sp.phase += Math.PI * dist / (s * 17); const after = Math.floor(sp.phase / Math.PI);
    if (after !== before) { SAVE.steps++; stepAcc++; sfx('step'); if (stepAcc % 8 === 0) save(); $('#steps').textContent = SAVE.steps.toLocaleString('ko-KR') + '걸음'; }
    const up = sp.target != null ? sp.target > sp.u : (sp.drag ? sp.dragU > sp.u : false);
    st.stamina = clamp(st.stamina - dt * (up ? 6.2 : 2.2) * (sp.speed / 34), 0, 100);
    st.sweat = clamp(st.sweat + dt * (3.2 + (100 - st.stamina) / 25), 0, 100);
  } else {
    if (st.sit) { st.stamina = clamp(st.stamina + dt * 5.5, 0, 100); st.sweat = clamp(st.sweat - dt * 3, 0, 100); }
    else { st.stamina = clamp(st.stamina + dt * .25, 0, 100); st.sweat = clamp(st.sweat - dt * .25, 0, 100); }
  }
  // sweat drops
  if (st.sweat > 55 && poseName !== 'wipe' && Math.random() < dt * .8) { const [hx, hy] = headPos(); spawn('drop', hx - sp.dir * 8 * sp.s, hy + 2 * sp.s); }
  if (poseName === 'fan' && Math.random() < dt * 6) { const [hx, hy] = headPos(); spawn('line', hx + sp.dir * -14 * sp.s * 0 + (-sp.dir) * 0 - 2, hy + 2 * sp.s + rnd(-6, 8), { dir: -sp.dir * -1 }); }
  if (poseName === 'pant' && Math.random() < dt * 2) { const [hx, hy] = headPos(); spawn('drop', hx - sp.dir * 8 * sp.s, hy); }
  if (poseName === 'sleepy') {}
  if (rexName === 'sleepy' && Math.random() < dt * .8) spawn('z', RX + 30, RY - 24);
  // hop
  if (sp.hopV !== 0 || sp.hop > 0) { sp.hop += sp.hopV * dt; sp.hopV -= 520 * dt; if (sp.hop <= 0) { sp.hop = 0; sp.hopV = 0; } }
  applyRig(t, dt); applyRock(t, dt); rockLife(dt, t); updateFX(dt);
  // blink spring
  nextBlink -= dt; if (nextBlink <= 0) { blinkT = .13; nextBlink = rnd(2, 5); } if (blinkT > 0) blinkT -= dt;
  drawScene(t, dt);
  // bubbles
  placeBubble('S', sp.x, sp.y + (cur.dy - 104) * sp.s - 4);
  placeBubble('R', RX, RY - 52);
  uiT += dt; if (uiT > .25) { uiT = 0; $('#bSt').style.width = st.stamina + '%'; $('#bWa').style.width = st.bottle + '%'; $('#bSt').style.background = st.stamina < 30 ? 'var(--warn)' : 'var(--moss)'; if (!$('#steps').textContent.includes('걸음')) $('#steps').textContent = '0걸음'; }
  requestAnimationFrame(frame);
}
function placeBubble(who, ax, ay) {
  const b = bub[who]; if (!b.on) return;
  const sw = stage.clientWidth, sh = stage.clientHeight, px = (ax - OX) / VW * sw, py = (ay - OY) / VH * sh;
  const w = b.w || b.el.offsetWidth, h = b.el.offsetHeight;
  const left = clamp(px - w / 2, 6, sw - w - 6), top = Math.max(4, py - h - 8);
  b.el.style.transform = `translate(${left.toFixed(1)}px,${top.toFixed(1)}px)`;
  b.el.style.setProperty('--tail', clamp(px - left, 14, w - 14).toFixed(1) + 'px');
}

/* ================= boot ================= */
$('#steps').textContent = SAVE.steps.toLocaleString('ko-KR') + '걸음';
photo.onload = () => { requestAnimationFrame(t => { last = t; frame(t); }); life(); trigger(actIntro); };
photo.src = IMG;
window.__terr = { trigger, setPose, st, sp, rockExpr, acts: { actRest, actDrink, actWipe, actTopic, actRockChat, actInvite, actFollow, actSing, actView, actClimb, actStretch, actJump }, addGust, cur };
})();
